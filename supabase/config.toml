minimum_password_length = 12
[auth.email]
enable_signup = true
enable_confirmations = true
[auth.rate_limit]
email_sent = 2
sign_in_sign_ups = 30
token_refresh = 150
[storage]
enabled = true
file_size_limit = "20MiB"
