project_id = "matecusucces-local"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
major_version = 15
[auth]
enabled = true
site_url = "http://localhost:4174"
additional_redirect_urls = ["http://localhost:4174/"]
